trigger:
  branches:
    include:
      - main
  paths:
    include:
      - frontend/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - frontend/**
pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    displayName: Build Frontend
    jobs:
      - job: Build
        displayName: Build React App
        steps:
          - task: NodeTool@0
            inputs:
              versionspec: '20.x'
            displayName: 'Installing Node.js'
          - script: |
              cd frontend
              npm ci
              npm run build
            env:
              VITE_API_BASE_URL: $(VITE_API_BASE_URL)
            displayName: 'Building Frontend'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'frontend/dist'
              artifact: 'frontend-drop'
              publishLocation: 'pipeline'
            displayName: 'Publish Frontend Artifact'
  - stage: DeployProduction
    displayName: 'Deploying in Azure'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployFrontend
        displayName: "Deploying Frontend"
        environment: 'Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadPipelineArtifact@2
                  displayName: 'Download Frontend Artifact'
                  inputs:
                    buildType: 'current'
                    artifactName: 'frontend-drop'
                    targetPath: '$(System.DefaultWorkingDirectory)/frontend-drop'
                - task: AzureStaticWebApp@0
                  displayName: 'Deploy to Static Web App'
                  inputs:
                    app_location: 'frontend-drop'
                    output_location: ''
                    skip_app_build: true
                    azure_static_web_apps_api_token: $(deployment_token)
          
